[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reload-benchmark"
version = "0.1.0"
description = "Full reload vs incremental load benchmark using Python and SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[project.scripts]
reload-benchmark = "reload_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
